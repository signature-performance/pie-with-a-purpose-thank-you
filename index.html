
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#770024">

  <title>Pie With a Purpose | Thank You</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #770024;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .video-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #770024;
    }

    video {
      display: block;
      width: 80%;
      max-width: 1400px;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      background: #770024;
    }

    video::-webkit-media-controls {
      display: none !important;
    }

    video::-webkit-media-controls-enclosure {
      display: none !important;
    }

    /* TABLETS */
    @media (max-width: 1024px) {
      video {
        width: 95%;
        max-width: none;
      }
    }

    /* MOBILE PHONES */
    @media (max-width: 600px) {
      .video-container {
        width: 100%;
        padding: 0;
        margin: 0;
      }

      video {
        width: 100%;
        max-width: none;
        height: auto;
        margin: 0;
        padding: 0;
        object-fit: contain;
      }
    }
  </style>
</head>

<body>
  <main class="video-container">
    <video
      autoplay
      muted
      playsinline
      preload="auto"
      disablepictureinpicture
      disableremoteplayback
      aria-label="Pie With a Purpose thank-you animation"
    >
      <source src="video.mp4" type="video/mp4">
    </video>
  </main>
</body>
</html>
