
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Pie With a Purpose | Thank You</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #770024;
    }

    .video-container {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background-color: #770024;
    }

    video {
      display: block;
      width: 80%;
      max-width: 1400px;
      height: auto;
      object-fit: contain;
      pointer-events: none;
    }

    video::-webkit-media-controls {
      display: none !important;
    }

    @media (max-width: 768px) {
      video {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="video-container">
    <video
      autoplay
      muted
      playsinline
      preload="auto"
      disablepictureinpicture
    >
      <source src="PWP%20Video.mp4" type="video/mp4">
    </video>
  </div>
</body>
</html>
